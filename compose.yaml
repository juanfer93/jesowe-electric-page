services:
  website-admin:
    container_name: jesowe-electric-admin-preview
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      ADMIN_CONTENT_PATH: /app/.data/site-content.json
      NODE_ENV: production
    ports:
      - "3001:3000"
    volumes:
      - jesowe-site-content:/app/.data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/admin/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  jesowe-site-content:
